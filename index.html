
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Counter</title>
<style>
body{font-family:Arial;background:#f3f4f6;padding:30px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:12px}
textarea{width:100%;height:180px;padding:12px;box-sizing:border-box}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.card{background:#e0ecff;padding:15px;border-radius:8px;flex:1;min-width:100px}
</style>
</head>
<body>
<main>
<h1>Text Counter</h1>
<p>Count words and characters instantly.</p>
<textarea id="text" placeholder="Type or paste your text..."></textarea>
<div class="stats">
<div class="card">Words: <b id="words">0</b></div>
<div class="card">Characters: <b id="chars">0</b></div>
<div class="card">Without spaces: <b id="noSpaces">0</b></div>
</div>
</main>
<script>
const input=document.getElementById("text");
function update(){
 const value=input.value;
 document.getElementById("words").textContent=
 value.trim()?value.trim().split(/\s+/).length:0;
 document.getElementById("chars").textContent=value.length;
 document.getElementById("noSpaces").textContent=
 value.replace(/\s/g,"").length;
}
input.addEventListener("input",update);
</script>
</body>
</html>
